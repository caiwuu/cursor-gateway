services:
  gateway:
    build: .
    image: cursor-gateway:latest
    container_name: cursor-gateway
    restart: unless-stopped
    ports:
      - "8788:8788"
      # 节点独立端口（直连节点时用）。主入口走 8788 的 /v1 和 /n/<slug>/v1 即可。
      - "8799-8818:8799-8818"
    environment:
      CURSOR_GATEWAY_HOST: 0.0.0.0
      CURSOR_GATEWAY_PORT: 8788
      CURSOR_GATEWAY_HOME: /data
      CURSOR_GATEWAY_REPO_ROOT: /app
      CURSOR_GATEWAY_ADMIN_TOKEN: ${CURSOR_GATEWAY_ADMIN_TOKEN:-}
    volumes:
      - gateway-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  gateway-data:
